        decided_by: { type: [string, "null"] }
        decision_reason: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }

    SourceProcessingJob:
      type: object
      additionalProperties: false
      required:
        - collection_job_id
        - project_id
        - source_asset_id
        - source_type
        - status
        - attempt_count
        - progress
        - result
      properties:
        collection_job_id: { type: string }
        project_id: { type: string }
        source_asset_id: { type: string }
        source_type: { type: string }
        status:
          $ref: "#/components/schemas/SourceProcessingJobStatus"
        attempt_count: { type: integer, minimum: 0 }
        progress: { type: integer, minimum: 0, maximum: 100 }
        result:
          type: object
          additionalProperties: true
        error_code: { type: [string, "null"] }
        error_message: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    ParsedArtifact:
      type: object
      additionalProperties: false
      required:
        - parsed_artifact_id
        - project_id
        - source_asset_id
        - collection_job_id
        - parser_id
        - parser_version
        - source_content_hash
        - fragment_count
        - created_at
      properties:
        parsed_artifact_id: { type: string }
        project_id: { type: string }
        source_asset_id: { type: string }
        collection_job_id: { type: string }
        parser_id: { type: string }
        parser_version: { type: string }
        source_content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        fragment_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }

    SourceLocator:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/SourceLocatorKind"
        page_number: { type: [integer, "null"], minimum: 1 }
        line_start: { type: [integer, "null"], minimum: 1 }
        line_end: { type: [integer, "null"], minimum: 1 }
        row_number: { type: [integer, "null"], minimum: 1 }
        char_start: { type: [integer, "null"], minimum: 0 }
        char_end: { type: [integer, "null"], minimum: 1 }
        json_pointer: { type: [string, "null"] }
        web_path: { type: [string, "null"] }
        timestamp_start_ms: { type: [integer, "null"], minimum: 0 }
        timestamp_end_ms: { type: [integer, "null"], minimum: 1 }
        frame_index: { type: [integer, "null"], minimum: 0 }
        media_artifact_id: { type: [string, "null"] }
        media_artifact_hash:
          type: [string, "null"]
          pattern: "^[a-f0-9]{64}$"
        connector_id: { type: [string, "null"] }
        model_id: { type: [string, "null"] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }

    MediaFragmentReview:
      type: object
      additionalProperties: false
      required: [decision, reviewer, reason]
      properties:
        decision:
          type: string
          enum: [verified, invalid]
        reviewer: { type: string, minLength: 1, maxLength: 120 }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    SourceFragment:
      type: object
      additionalProperties: false
      required:
        - source_fragment_id
        - parsed_artifact_id
        - project_id
        - source_asset_id
        - ordinal
        - locator
        - original_excerpt
        - excerpt_hash
        - verification_status
        - created_at
      properties:
        source_fragment_id: { type: string }
        parsed_artifact_id: { type: string }
        project_id: { type: string }
        source_asset_id: { type: string }
        ordinal: { type: integer, minimum: 0 }
        locator:
          $ref: "#/components/schemas/SourceLocator"
        original_excerpt: { type: string, minLength: 1 }
        excerpt_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        verification_status:
          $ref: "#/components/schemas/SourceFragmentVerificationStatus"
        created_at: { type: string, format: date-time }

    SourceFragmentPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceFragment"
        next_cursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }

    SourceProcessingStatus:
      type: object
      additionalProperties: false
      required: [job, parsed_artifact]
      properties:
        job:
          $ref: "#/components/schemas/SourceProcessingJob"
        parsed_artifact:
          oneOf:
            - $ref: "#/components/schemas/ParsedArtifact"
            - type: "null"

    EvidencePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        next_cursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }

    Claim:
      type: object
      additionalProperties: false
      required: [claim_id, statement, claim_type, evidence_ids, contradicting_evidence_ids, status]
      properties:
        claim_id: { type: string }
        statement: { type: string }
        claim_type:
          type: string
          enum: [fact, user_opinion, vendor_claim, inference, hypothesis]
        evidence_ids:
          type: array
          items: { type: string }
        contradicting_evidence_ids:
          type: array
          items: { type: string }
        scope:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/ClaimStatus"

    ContextSignal:
      type: object
      additionalProperties: false
      required: [type, source, availability, authorization, freshness, latency_ms, confidence, fallback]
      properties:
        type: { type: string }
        source: { type: string }
        availability:
          type: string
          enum: [available, partial, simulated, unavailable, unverified]
        authorization: { type: string }
        freshness: { type: string }
        latency_ms: { type: integer, minimum: 0 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        fallback: { type: string }

    EventUnderstanding:
      type: object
      additionalProperties: false
      required: [base_event, event_state, context_signals, inference, risk_or_value, recommended_action]
      properties:
        base_event:
          type: object
          required: [type, source]
          properties:
            type: { type: string }
            source: { type: string }
          additionalProperties: false
        event_state:
          type: object
          required: [type, source]
          properties:
            type: { type: string }
            source: { type: string }
          additionalProperties: false
        context_signals:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/ContextSignal"
        inference: { type: string }
        risk_or_value: { type: string }
        recommended_action: { type: string }

    ScoreComponent:
      type: object
      additionalProperties: false
      required: [score, weight, rationale, evidence_ids]
      properties:
        score: { type: number, minimum: 0, maximum: 100 }
        weight: { type: number, exclusiveMinimum: 0, maximum: 1 }
        rationale: { type: string }
        evidence_ids:
          type: array
          items: { type: string }

    RedTeamReview:
      type: object
      additionalProperties: false
      required: [severity, required_actions, score_adjustments, decision]
      properties:
        severity:
          type: string
          enum: [low, medium, high]
        critical_assumptions:
          type: array
          items: { type: string }
        evidence_issues:
          type: array
          items: { type: string }
        event_understanding_challenges:
          type: array
          items: { type: string }
        competitor_challenges:
          type: array
          items: { type: string }
        technical_risks:
          type: array
          items: { type: string }
        business_risks:
          type: array
          items: { type: string }
        privacy_and_safety_risks:
          type: array
          items: { type: string }
        required_actions:
          type: array
          items: { type: string }
        score_adjustments:
          type: object
          additionalProperties: { type: number }
        decision:
          type: string
          enum: [pass, revise, research_more, reject]

    Innovation:
      type: object
      additionalProperties: false
      required:
        - innovation_id
        - name
        - status
        - target_user
        - problem
        - event_understanding
        - competitor_gap_ids
        - evidence_ids
        - score_breakdown
        - final_score
      properties:
        innovation_id: { type: string }
        name: { type: string }
        status:
          $ref: "#/components/schemas/InnovationStatus"
        target_user:
          type: object
          required: [persona_ids, description]
          properties:
            persona_ids:
              type: array
              items: { type: string }
            description: { type: string }
          additionalProperties: false
        problem:
          type: object
          required: [pain_ids, description]
          properties:
            pain_ids:
              type: array
              items: { type: string }
            description: { type: string }
          additionalProperties: false
        event_understanding:
          $ref: "#/components/schemas/EventUnderstanding"
        competitor_gap_ids:
          type: array
          items: { type: string }
        technical_assessment:
          type: object
          additionalProperties: true
        business_assessment:
          type: object
          additionalProperties: true
        red_team_review:
          oneOf:
            - $ref: "#/components/schemas/RedTeamReview"
            - type: "null"
        evidence_ids:
          type: array
          minItems: 1
          items: { type: string }
        score_breakdown:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ScoreComponent"
        final_score: { type: number, minimum: 0, maximum: 100 }

    DecisionCreate:
      type: object
      additionalProperties: false
      required: [decision_id, action, reason, actor, selected_innovation_ids]
      properties:
        decision_id: { type: string }
        action:
          $ref: "#/components/schemas/DecisionAction"
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        actor:
          type: object
          additionalProperties: false
          required: [type, actor_id, display_name]
          properties:
            type:
              type: string
              enum: [web_user, feishu_user, operator]
            actor_id: { type: string }
            display_name: { type: string }
        selected_innovation_ids:
          type: array
          items: { type: string }

    DemoInput:
      type: object
      additionalProperties: false
      required: [signal_type, value, source, observed_at, confidence, is_simulated]
      properties:
        signal_type: { type: string }
        value: {}
        source: { type: string }
        observed_at: { type: string, format: date-time }
        confidence: { type: number, minimum: 0, maximum: 1 }
        is_simulated: { type: boolean }

    DemoResult:
      type: object
      additionalProperties: false
      required:
        - demo_result_id
        - project_id
        - innovation_id
        - status
        - inputs
        - inference
        - risk_level
        - recommended_action
        - metrics
        - limitations
        - evidence_ids
        - started_at
        - completed_at
      properties:
        demo_result_id: { type: string }
        project_id: { type: string }
        innovation_id: { type: string }
        status:
          type: string
          enum: [succeeded, partial, failed, inconclusive]
        inputs:
          type: array
          minItems: 3
          items:
            $ref: "#/components/schemas/DemoInput"
        inference: { type: string }
        risk_level:
          type: string
          enum: [none, low, medium, high, uncertain]
        recommended_action: { type: string }
        metrics:
          type: object
          additionalProperties: { type: number }
        limitations:
          type: array
          items: { type: string }
        evidence_ids:
          type: array
          items: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    Report:
      type: object
      additionalProperties: false
      required: [report_id, project_id, version, recommendation, sections, cited_evidence_ids, unknowns, generated_at]
      properties:
        report_id: { type: string }
        project_id: { type: string }
        version: { type: integer, minimum: 1 }
