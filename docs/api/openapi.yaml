openapi: 3.1.0
info:
  title: AgentInsight × eufy API
  version: 0.11.0
  description: |
    AIPDF 事件理解产品研究工作台的 v2 目标契约。
    v1 继续服务现有前端骨架；v2 在后续实现分支中落地新的研究状态、Innovation、Demo 和飞书集成。
servers:
  - url: http://localhost:8000/api/v2
tags:
  - name: System
  - name: Models
  - name: Runtimes
  - name: Projects
  - name: Research
  - name: Evidence
  - name: Innovations
  - name: Demo
  - name: Reports
  - name: Feishu
paths:
  /health:
    get:
      tags: [System]
      summary: 检查服务健康状态
      operationId: getHealth
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /models:
    get:
      tags: [Models]
      summary: 查询当前可供用户选择的模型
      operationId: listModels
      responses:
        "200":
          description: 返回已启用模型及凭据可用状态，不暴露 Provider 密钥或内部凭据名称。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPage"
        default:
          $ref: "#/components/responses/Error"

  /runtimes:
    get:
      tags: [Runtimes]
      summary: List selectable external Agent runtimes
      operationId: listExternalRuntimes
      responses:
        "200":
          description: Returns safe runtime capability and availability metadata without credentials or local paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalRuntimePage"
        default:
          $ref: "#/components/responses/Error"

  /projects:
    get:
      tags: [Projects]
      summary: 查询研究项目列表
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 按最近更新时间倒序返回项目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Projects]
      summary: 创建研究项目
      operationId: createProject
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: 已创建项目并进入 Brief 人工确认门。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}:
    get:
      tags: [Projects]
      summary: 查询单个研究项目
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 当前项目状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/agents:
    get:
      tags: [Projects]
      summary: 查询 Agent 运行状态
      operationId: listAgentRuns
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 六类 Agent 及其子任务运行记录。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentRun"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/agents/user-research:
    post:
      tags: [Research]
      summary: 运行用户研究 Agent
      description: |
        只把同项目、已验证或部分验证的 Evidence 投影给已注册的真实 Runtime。
        Agent 输出必须逐项引用输入 Evidence ID；证据不足时返回 partial，而不是补造结论。
      operationId: runUserResearchAgent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 已由 Runtime 保存的版本化用户研究 Artifact。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResearchArtifact"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/agents/user-research/artifacts:
    get:
      tags: [Research]
      summary: 查询用户研究 Artifact 历史版本
      operationId: listUserResearchArtifacts
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 按版本升序返回持久化用户研究产物。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResearchArtifact"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/agents/product-technical:
    post:
      tags: [Research]
      summary: Run the product technical opportunity Agent
      description: |
        Uses the latest advancing user-research and competitor-synthesis Artifacts for the project.
        Candidates are generated dynamically from their cited Evidence, never padded with templates.
        The target is three candidates and the hard maximum is five; fewer candidates are valid when
        the Artifact reports the missing research needed to support additional opportunities.
      operationId: runProductTechnicalAgent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: A persisted, evidence-bounded product opportunity portfolio Artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductTechnicalArtifact"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/agents/product-technical/artifacts:
    get:
      tags: [Research]
      summary: List product technical opportunity Artifact versions
      operationId: listProductTechnicalArtifacts
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Product technical Artifacts in ascending version order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductTechnicalArtifact"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/agents/product-technical/artifacts/{artifact_id}/source-recovery:
    post:
      tags: [Research, Evidence]
      summary: Create a user-input recovery task from product opportunity gaps
      description: |
        Converts selected portfolio gaps from a persisted Product Technical Artifact into
        structured fields for a frontend recovery dialog. The resulting user declaration is
        reviewed, persisted as Evidence, and resumes only the affected upstream research tasks
        plus Product Technical. No failed URL or source asset is required.
      operationId: createProductTechnicalSourceRecovery
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ArtifactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductTechnicalSourceRecoveryCreate"
      responses:
        "201":
          description: A structured recovery task suitable for a frontend dialog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRecovery"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/agents/competitor-discovery:
    post:
      tags: [Research]
      summary: 运行竞品候选发现 Agent
      description: |
        从当前项目已完成的 competitor_candidate 搜索运行构建受控候选上下文，调用项目
        选择的模型生成候选竞品 Artifact。模型只能引用输入 candidate_id；搜索候选不是
        Evidence，运行结果在人工 Candidate Gate 确认前不会修改正式竞品范围。
      operationId: runCompetitorDiscoveryAgent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorDiscoveryRunCreate"
      responses:
        "200":
          description: 已保存的版本化竞品候选 Artifact。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorDiscoveryArtifact"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/agents/competitor-discovery/artifacts:
    get:
      tags: [Research]
      summary: 查询竞品候选 Artifact 历史版本
      operationId: listCompetitorDiscoveryArtifacts
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 按版本升序返回 Artifact 及其 Candidate Gate 状态。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitorDiscoveryArtifact"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/agents/competitor-discovery/artifacts/{artifact_id}/decision:
    post:
      tags: [Research]
      summary: 提交竞品候选人工 Gate 决定
      description: |
        confirm 只能选择当前 Artifact 中的 proposal_id，并将对应准确型号合并到正式竞品
        范围；reject 和 request_revision 不修改范围。每个 Artifact 只能提交一次决定。
      operationId: decideCompetitorDiscoveryCandidates
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: artifact_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorCandidateDecisionCreate"
      responses:
        "200":
          description: 已保存 Gate 决定及重新计算的资料准备度。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorCandidateDecisionResult"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/competitor-source-onboardings:
    get:
      tags: [Evidence]
      summary: 查询竞品候选来源接入记录
      description: |
        返回当前项目由已确认 Candidate Gate 产生的 Source Onboarding 批次及完整血缘。
        接入记录不是 Evidence；网页处理和资料路由的当前状态应分别通过 Source Processing
        与 Source Routing 接口查询。
      operationId: listCompetitorSourceOnboardings
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 按创建时间倒序返回项目内的竞品来源接入批次。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorSourceOnboardingPage"
        default:
          $ref: "#/components/responses/Error"

    post:
      tags: [Evidence]
      summary: 将已确认竞品候选批量登记为授权 Source Asset
      description: |
        只允许使用 Candidate Gate 已 confirm 的竞品发现 Artifact。系统自动选择该决定中
        proposal 关联的 candidate URL，重新执行公开 URL 安全校验并批量登记 Source Asset。
        同一 Artifact 重复请求幂等复用。接入事务提交后，系统在后台把仍处于 queued 的
        Collection Job 交给现有网页处理链路；单个来源失败不会回滚接入批次。成功解析的
        来源继续自动执行 Source Routing，低置信度结果保持 needs_review，不越过人工路由
        门禁。批次结束后基于结构化产品血缘重新计算 Source Requirements 并发布项目事件。
        响应不等待后台处理完成，也不把 queued、failed、仅完成解析或仅完成路由的资料表示为
        Evidence。
      operationId: createCompetitorSourceOnboarding
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorSourceOnboardingCreate"
      responses:
        "201":
          description: 已创建接入批次、Source Asset 与待处理 Collection Job。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorSourceOnboardingResult"
        "200":
          description: 该 Artifact 已完成接入，返回原有幂等结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorSourceOnboardingResult"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/competitor-material-discoveries:
    get:
      tags: [Evidence]
      summary: 查询竞品研究资料发现批次
      description: 返回当前项目按准确产品和研究维度生成的资料搜索计划、真实搜索运行和候选来源。
      operationId: listCompetitorMaterialDiscoveries
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 按创建时间倒序返回资料发现批次。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorMaterialDiscoveryPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Evidence]
      summary: 按产品和维度发现竞品研究资料
      description: |
        只允许选择当前 Source Requirements 范围内具有准确型号的目标产品或竞品，并为
        official_product、price_channel、user_review 生成确定性查询计划。系统调用已注册的
        Search Provider，但候选固定为 candidate_only；不会抓取正文、自动授权或创建 Evidence。
      operationId: createCompetitorMaterialDiscovery
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorMaterialDiscoveryCreate"
      responses:
        "201":
          description: 资料发现计划及其搜索结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorMaterialDiscovery"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/competitor-material-discoveries/{material_discovery_id}:
    get:
      tags: [Evidence]
      summary: 查询一个竞品研究资料发现批次
      operationId: getCompetitorMaterialDiscovery
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: material_discovery_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "200":
          description: 完整搜索计划、候选和当前决定。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorMaterialDiscovery"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/competitor-material-discoveries/{material_discovery_id}/decision:
    post:
      tags: [Evidence]
      summary: 确认或拒绝竞品研究资料候选
      description: |
        只能选择该批次真实 Search Run 中的 candidate ID。confirm 必须再次确认公开资料授权；
        系统原子登记或复用 Source Asset、Collection Job 及产品/维度血缘，随后在后台复用现有
        网页处理、Source Routing 和 Source Requirements 重评。重复决定幂等返回原结果。
      operationId: decideCompetitorMaterialDiscovery
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: material_discovery_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorMaterialDecisionCreate"
      responses:
        "201":
          description: 首次保存的决定和已接入来源。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorMaterialDecisionResult"
        "200":
          description: 幂等复用已存在的决定。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorMaterialDecisionResult"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/fragment-evidence-batches:
    get:
      tags: [Evidence]
      summary: 查询 Fragment Evidence 审核批次
      operationId: listFragmentEvidenceBatches
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 当前项目的 Evidence Draft 批次。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FragmentEvidenceBatchPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Evidence]
      summary: 从已处理资料创建 Evidence Draft 批次
      description: |
        只读取 ready Source Asset、成功 Collection Job、verified Source Fragment、confirmed Source
        Routing 和结构化产品/维度血缘。该操作不调用模型，也不创建 Evidence；不满足门禁的片段以
        blocked item 返回，已经晋级的片段标记为 already_promoted。
      operationId: createFragmentEvidenceBatch
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FragmentEvidenceBatchCreate"
      responses:
        "201":
          description: 持久化的确定性 Evidence Draft 批次。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FragmentEvidenceBatch"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/fragment-evidence-batches/{fragment_evidence_batch_id}:
    get:
      tags: [Evidence]
      summary: 查询一个 Fragment Evidence 审核批次
      operationId: getFragmentEvidenceBatch
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: fragment_evidence_batch_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "200":
          description: Draft、Gate 决定和每项晋级结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FragmentEvidenceBatch"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/fragment-evidence-batches/{fragment_evidence_batch_id}/decision:
    post:
      tags: [Evidence]
      summary: 提交 Fragment Evidence 一次性审核决定
      description: |
        confirm 只能选择该批次 eligible item，并为每项选择后端允许的 Claim 类型。产品、地区、
        Source Locator 和质量先验由后端血缘与固定策略生成，客户端不能覆盖。每个片段重新执行
        完整来源链校验后才进入 Evidence Lake；相同决定幂等并可恢复未完成项，不同决定冲突。
      operationId: decideFragmentEvidenceBatch
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: fragment_evidence_batch_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FragmentEvidenceDecisionCreate"
      responses:
        "200":
          description: 已保存的 Gate 决定和当前晋级结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FragmentEvidenceDecisionResult"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/events:
    get:
      tags: [Projects]
      summary: 订阅项目实时事件
      operationId: streamProjectEvents
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 每条 SSE data 为一个 ProjectEvent JSON 对象；事件类型放在对象字段中，SSE 使用默认 message 事件。
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/source-requirements:
    get:
      tags: [Evidence]
      summary: 评估项目当前资料准备度
      description: |
        基于已保存的产品范围、Competitor Source Onboarding 的结构化产品血缘、已确认资料
        路由和可用于 Agent 的 Evidence 进行确定性评估。存在结构化血缘时不得使用标题、
        URL 或 purpose 把同一资料模糊匹配给其他产品；没有血缘的用户资料仍使用保守元数据
        匹配。该接口不会调用模型、抓取网页或生成事实；资料不足时返回具体补充动作。
      operationId: getSourceRequirements
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 当前项目的资料准备度和逐项缺口。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRequirementAssessment"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/source-requirements/scope:
    put:
      tags: [Evidence]
      summary: 保存资料准备度评估使用的产品范围
      description: |
        保存目标产品、待比较竞品和研究维度。允许先保存只有品牌、尚无准确型号的范围，
        但在型号补齐前准备度保持 blocked。每次修改记录 actor、reason 和项目事件。
      operationId: updateSourceRequirementScope
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceRequirementScopeUpdate"
      responses:
        "200":
          description: 保存范围后重新计算的资料准备度。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRequirementAssessment"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/source-recoveries:
    get:
      tags: [Evidence]
      summary: 查询资料恢复记录
      description: 返回网页或媒体资料处理失败、或有效信息不足后生成的用户补充任务。
      operationId: listSourceRecoveries
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 按创建时间倒序返回当前项目的恢复记录。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRecoveryPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Evidence]
      summary: 为失败或信息不足的资料创建恢复任务
      description: |
        确定性读取资料处理状态与 Source Requirements，分类失败原因并生成前端可直接
        展示的缺失字段。不会调用模型、重新抓取网页或生成事实。
      operationId: createSourceRecovery
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceRecoveryCreate"
      responses:
        "201":
          description: 已创建等待用户补充的恢复任务；相同未完成问题会返回既有记录。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRecovery"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/source-recoveries/{source_recovery_id}:
    get:
      tags: [Evidence]
      summary: 查询单个资料恢复任务
      operationId: getSourceRecovery
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceRecoveryId"
      responses:
        "200":
          description: 包含失败原因、缺失字段、补充历史、复评结果和恢复指令。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRecovery"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/source-recoveries/{source_recovery_id}/submissions:
    post:
      tags: [Evidence]
      summary: 提交用户补充的具体内容
      description: |
        将用户确认的结构化内容保存为 user_input Source Asset，并建立 Collection Job、
        Fragment、人工确认路由和 partially_verified Evidence 的完整血缘；随后重新评估
        Source Requirements。用户声明不会伪装成官网或第三方来源。
      operationId: submitSourceRecovery
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceRecoveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceRecoverySubmissionCreate"
      responses:
        "201":
          description: 补充内容已进入证据链，并返回复评后的恢复状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRecovery"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/source-recoveries/{source_recovery_id}/decisions:
    post:
      tags: [Evidence]
      summary: 对未补齐的资料恢复任务作出人工决定
      description: 允许用户明确选择带缺口继续或取消；不会把缺失事实补造成 Evidence。
      operationId: decideSourceRecovery
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceRecoveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceRecoveryDecisionCreate"
      responses:
        "200":
          description: 已保存人工决定及对应的定向恢复指令。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRecovery"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/source-discovery/searches:
    get:
      tags: [Evidence]
      summary: 查询项目的搜索发现运行记录
      description: |
        返回当前项目的搜索发现记录。搜索命中只是待审核的来源候选，不是 Source Asset、
        Evidence 或事实结论，不能直接进入任何业务 Agent。
      operationId: listSearchDiscoveryRuns
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 按创建时间倒序返回搜索发现记录。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchDiscoveryRunPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Evidence]
      summary: 运行一次受控的公开来源搜索发现
      description: |
        调用显式注册的搜索 Provider，保存去重后的公开网页候选及失败状态。该接口不抓取
        候选网页、不确认使用授权、不创建 Source Asset，也不把 Provider 摘要提升为 Evidence。
      operationId: createSearchDiscoveryRun
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchDiscoveryCreate"
      responses:
        "201":
          description: 已保存搜索发现运行；具体结果由 status、error_code 和 retryable 表示。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchDiscoveryRun"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/source-discovery/searches/{search_discovery_run_id}:
    get:
      tags: [Evidence]
      summary: 查询单次搜索发现运行
      operationId: getSearchDiscoveryRun
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: search_discovery_run_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "200":
          description: 当前项目内的搜索发现运行详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchDiscoveryRun"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources:
    get:
      tags: [Evidence]
      summary: 查询项目已授权的原始资料
      operationId: listSourceAssets
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SourceAssetKind"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SourceAssetStatus"
      responses:
        "200":
          description: 只返回当前项目的 Source Asset，不返回文件系统路径。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceAssetPage"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/files:
    post:
      tags: [Evidence]
      summary: 上传并登记一份用户或企业授权的原始文件
      operationId: uploadSourceFile
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SourceFileUpload"
      responses:
        "201":
          description: 文件已按项目隔离保存，同时创建待解析 Collection Job；重复内容返回既有资产。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceAssetIngestResult"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/links:
    post:
      tags: [Evidence]
      summary: 登记一个用户明确指定的公开资料链接
      description: 该操作只登记和校验链接，不在请求中抓取网页内容。
      operationId: createSourceLink
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceLinkCreate"
      responses:
        "201":
          description: 链接已登记，同时创建待解析 Collection Job；重复链接返回既有资产。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceAssetIngestResult"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/{source_asset_id}:
    get:
      tags: [Evidence]
      summary: 查询单个原始资料资产
      operationId: getSourceAsset
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
      responses:
        "200":
          description: Source Asset 元数据。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceAsset"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/{source_asset_id}/routing:
    get:
      tags: [Evidence]
      summary: 查询资料的多标签路由分析与确认结果
      operationId: getSourceRouting
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
      responses:
        "200":
          description: 返回规则/模型建议、确认路由和模型审计字段，不返回 Prompt 或密钥。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRouting"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/{source_asset_id}/routing/analyze:
    post:
      tags: [Evidence]
      summary: 分析一份已解析资料应分发给哪些研究 Agent
      description: |
        先运行确定性规则；规则不足时可调用项目选择的模型进行受控多标签分类。
        该操作只决定资料路由，不创建事实 Claim，也不绕过 Evidence 审核。
      operationId: analyzeSourceRouting
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceRoutingAnalyze"
      responses:
        "200":
          description: 返回幂等复用或重新分析后的路由结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRouting"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/{source_asset_id}/routing/decision:
    post:
      tags: [Evidence]
      summary: 确认、修改或拒绝资料路由建议
      operationId: decideSourceRouting
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceRoutingDecision"
      responses:
        "200":
          description: 保存可审计的人工路由决策。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRouting"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Evidence]
      summary: 删除原始资料内容并保留最小审计记录
      operationId: deleteSourceAsset
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
      responses:
        "200":
          description: 文件内容已删除，资产状态变为 deleted，审计记录保留。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceAsset"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/{source_asset_id}/processing:
    get:
      tags: [Evidence]
      summary: Get deterministic source-processing status
      operationId: getSourceProcessingStatus
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
      responses:
        "200":
          description: Current Collection Job and optional parsed artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceProcessingStatus"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Evidence]
      summary: Process an authorized source with a registered deterministic parser
      description: |
        The request runs the bounded parser synchronously in v1 while persisting every
        Collection Job transition. Authorized public links use the registered safe web
        connector. Audio and video first pass bounded deterministic media preparation;
        semantic transcript or frame observations require an explicitly registered media
        understanding connector and remain review-required until a human verifies them.
      operationId: processSourceAsset
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
      responses:
        "200":
          description: Existing successful result or the newly completed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceProcessingStatus"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/{source_asset_id}/processing/retry:
    post:
      tags: [Evidence]
      summary: Retry a failed or blocked source-processing job
      operationId: retrySourceProcessing
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
      responses:
        "200":
          description: Result after the bounded retry attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceProcessingStatus"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/{source_asset_id}/processing/cancel:
    post:
      tags: [Evidence]
      summary: Cancel a queued source-processing job
      operationId: cancelSourceProcessing
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
      responses:
        "200":
          description: Cancelled job state. Completed jobs remain unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceProcessingStatus"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/{source_asset_id}/fragments:
    get:
      tags: [Evidence]
      summary: List verified or review-required source fragments
      operationId: listSourceFragments
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Original excerpts and media-derived text with auditable locators.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFragmentPage"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/{source_asset_id}/fragments/{source_fragment_id}/review:
    post:
      tags: [Evidence]
      summary: Review an AI-derived media fragment against its retained media artifact
      operationId: reviewMediaSourceFragment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
        - $ref: "#/components/parameters/SourceFragmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaFragmentReview"
      responses:
        "200":
          description: Updated fragment. Only verified fragments may be promoted to Evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFragment"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/{source_asset_id}/fragments/{source_fragment_id}/evidence:
    post:
      tags: [Evidence]
      summary: 将已验证资料片段晋级为 Evidence
      description: |
        重新核验 SourceAsset、ParsedArtifact、Collection Job、原文 Hash 和定位信息后晋级。
        derived、invalid、跨项目或来源链不完整的片段不得进入 Evidence Lake。
      operationId: promoteSourceFragmentToEvidence
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
        - $ref: "#/components/parameters/SourceFragmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceFromSourceFragmentCreate"
      responses:
        "200":
          description: 已存在的相同 Evidence。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceIngestResult"
        "201":
          description: 新建的可追溯 Evidence。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceIngestResult"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/sources/{source_asset_id}/media-artifacts/{media_artifact_id}:
    get:
      tags: [Evidence]
      summary: Read a retained audio track or sampled frame for authorized human review
      operationId: getMediaArtifact
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SourceAssetId"
        - $ref: "#/components/parameters/MediaArtifactId"
      responses:
        "200":
          description: Project-scoped media derivative used by the analysis connector.
          content:
            audio/wav:
              schema: { type: string, contentEncoding: binary }
            image/png:
              schema: { type: string, contentEncoding: binary }
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/evidence:
    get:
      tags: [Evidence]
      summary: 查询项目证据
      operationId: listEvidence
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EvidenceStatus"
        - name: source_type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Evidence records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePage"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/claims:
    get:
      tags: [Evidence]
      summary: 查询 Claim 与证据关系
      operationId: listClaims
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Claims and their evidence relationships.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Claim"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/innovations:
    get:
      tags: [Innovations]
      summary: 查询候选事件理解场景
      operationId: listInnovations
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 至少三个候选及评分、红队结论和晋级状态。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Innovation"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/decisions:
    post:
      tags: [Projects]
      summary: 提交人工阶段决定
      operationId: submitDecision
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionCreate"
      responses:
        "202":
          description: 已记录决定并请求从对应 Checkpoint 恢复。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/demo-result:
    get:
      tags: [Demo]
      summary: 查询晋级场景 Demo 结果
      operationId: getDemoResult
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Demo 输入、风险判断、行动建议、指标和限制。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResult"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/report:
    get:
      tags: [Reports]
      summary: 查询最终研究提案
      operationId: getReport
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 建议立项、补充验证或不建议立项的版本化报告。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/metrics:
    get:
      tags: [Reports]
      summary: 查询运行与方法对照指标
      operationId: getMetrics
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Runtime, evidence, quality and comparison metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metrics"
        default:
          $ref: "#/components/responses/Error"

  /integrations/feishu/researches:
    post:
      tags: [Feishu]
      summary: Aily 创建研究项目
      description: Aily create_research API Skill。必须快速返回，实际研究异步运行。
      operationId: feishuCreateResearch
      security:
        - FeishuSkillBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeishuResearchCreate"
      responses:
        "201":
          description: 已创建项目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeishuResearchCreated"
        default:
          $ref: "#/components/responses/Error"

  /integrations/feishu/researches/{project_id}/status:
    get:
      tags: [Feishu]
      summary: Aily 查询研究状态
      operationId: feishuGetResearchStatus
      security:
        - FeishuSkillBearer: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 项目阶段、Agent 状态、证据覆盖和待决定事项。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeishuResearchStatus"
        default:
          $ref: "#/components/responses/Error"

  /integrations/feishu/researches/{project_id}/findings:
    get:
      tags: [Feishu]
      summary: Aily 查询已通过门禁的研究结论
      operationId: feishuGetResearchFindings
      security:
        - FeishuSkillBearer: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 候选场景、关键 Findings、Unknowns 与 Web 地址。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeishuResearchFindings"
        default:
          $ref: "#/components/responses/Error"

  /integrations/feishu/researches/{project_id}/decisions:
    post:
      tags: [Feishu]
      summary: Aily 或飞书卡片提交人工决定
      operationId: feishuSubmitDecision
      security:
        - FeishuSkillBearer: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeishuDecisionCreate"
      responses:
        "202":
          description: 已记录决定并请求恢复工作流。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeishuResearchStatus"
        default:
          $ref: "#/components/responses/Error"

  /integrations/feishu/researches/{project_id}/report:
    get:
      tags: [Feishu]
      summary: Aily 查询最终报告摘要
      operationId: feishuGetFinalReport
      security:
        - FeishuSkillBearer: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 最终建议、报告摘要、Web 地址和飞书文档地址。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeishuReportSummary"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    FeishuSkillBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^proj_[A-Za-z0-9_-]+$"
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^artifact_[A-Za-z0-9_-]+$"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    SourceAssetId:
      name: source_asset_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^source_[A-Za-z0-9_-]+$"
    SourceRecoveryId:
      name: source_recovery_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^recovery_[A-Za-z0-9_-]+$"
    SourceFragmentId:
      name: source_fragment_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^fragment_[A-Za-z0-9_-]+$"
    MediaArtifactId:
      name: media_artifact_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"

  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string

    ProjectStatus:
      type: string
      enum:
        - draft
        - awaiting_brief_approval
        - opportunity_research
        - scenario_comparison
        - supplementing_research
        - awaiting_scenario_approval
        - demo_running
        - awaiting_final_approval
        - completed
        - rejected
        - failed
        - terminated

    DecisionAction:
      type: string
      enum: [approve, revise, research_more, reject, terminate]

    DecisionGate:
      type: string
      enum: [brief, scenario, final]

    AgentRunStatus:
      type: string
      enum: [pending, running, completed, partial, failed, blocked, needs_revision, cancelled]

    ModelCapability:
      type: string
      enum: [text, structured_output, vision, tools, reasoning]

    ModelSummary:
      type: object
      additionalProperties: false
      required: [model_id, provider, display_name, capabilities, enabled, credential_available]
      properties:
        model_id: { type: string, minLength: 3, maxLength: 120 }
        provider: { type: string, minLength: 1, maxLength: 80 }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ModelCapability"
        enabled: { type: boolean }
        credential_available: { type: boolean }
        context_window: { type: [integer, "null"], minimum: 1 }
        input_cost_microusd_per_million_tokens: { type: [integer, "null"], minimum: 0 }
        output_cost_microusd_per_million_tokens: { type: [integer, "null"], minimum: 0 }

    ModelPage:
      type: object
      additionalProperties: false
      required: [items, default_model_id]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelSummary"
        default_model_id: { type: [string, "null"] }

    RuntimeCapability:
      type: string
      enum: [text, structured_output, local_files, webpage, image, audio, video]

    ExternalRuntimeSummary:
      type: object
      additionalProperties: false
      required:
        - runtime_id
        - display_name
        - adapter_type
        - capabilities
        - enabled
        - executable_available
        - credential_available
        - available
        - version
        - unavailable_reason
        - model_id
      properties:
        runtime_id: { type: string, minLength: 1, maxLength: 80 }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        adapter_type: { type: string, const: external_cli }
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuntimeCapability"
        enabled: { type: boolean }
        executable_available: { type: boolean }
        credential_available: { type: boolean }
        available: { type: boolean }
        version: { type: [string, "null"], maxLength: 200 }
        unavailable_reason:
          type: [string, "null"]
          enum: [disabled, executable_missing, credential_missing, probe_failed, null]
        model_id: { type: [string, "null"], maxLength: 200 }

    ExternalRuntimePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalRuntimeSummary"

    ModelSelection:
      type: object
      additionalProperties: false
      required: [default_model_id]
      properties:
        default_model_id: { type: string, minLength: 3, maxLength: 120 }
        agent_overrides:
          type: object
          additionalProperties:
            type: string
            minLength: 3
            maxLength: 120
          default: {}

    InnovationStatus:
      type: string
      enum: [draft, evidence_pending, tech_review, business_review, red_team_review, needs_revision, recommended, rejected]

    EvidenceStatus:
      type: string
      enum: [verified, partially_verified, unverified, outdated, mock, invalid]

    EvidenceClaimType:
      type: string
      enum:
        - fact
        - user_opinion
        - vendor_claim
        - agent_inference
        - product_identity
        - capability
        - specification
        - compatibility
        - limitation
        - price_observation
        - channel_availability
        - seller_information
        - promotion
        - market_fact
        - technical_fact

    SourceAssetKind:
      type: string
      enum: [file, link, user_input]

    SourceAssetStatus:
      type: string
      enum: [ready, deleted]

    SourceMediaCategory:
      type: string
      enum: [document, dataset, image, video, audio, webpage]

    SourceAuthorizationBasis:
      type: string
      enum: [user_owned, enterprise_authorized, publicly_available]

    CompetitorResearchDimension:
      type: string
      enum: [official_product, price_channel, user_review]

    SourceReadinessStatus:
      type: string
      enum: [ready, partial, blocked]

    SourceRequirementStatus:
      type: string
      enum: [satisfied, partial, missing, blocked]

    SourceRequirementSeverity:
      type: string
      enum: [required, recommended]

    ProductRole:
      type: string
      enum: [target, competitor]

    SourceRecoveryStatus:
      type: string
      enum: [waiting_for_user_input, needs_more_information, resolved, proceeding_with_gaps, cancelled]

    SourceRecoveryReasonCode:
      type: string
      enum:
        - robots_blocked
        - authentication_required
        - access_denied
        - rate_limited
        - connector_unavailable
        - unsupported_media
        - processing_failed
        - empty_content
        - insufficient_information

    SourceRecoveryDecisionAction:
      type: string
      enum: [proceed_with_gaps, cancel]

    SourceRecoveryResumeMode:
      type: string
      enum: [none, targeted_retry, proceed_with_gaps]

    CompetitorCandidateGateStatus:
      type: string
      enum: [pending, confirmed, rejected, revision_requested]

    CompetitorCandidateDecisionAction:
      type: string
      enum: [confirm, reject, request_revision]

    CompetitorComparisonDimension:
      type: string
      enum: [category_fit, user_segment, use_case, form_factor, feature_set, price_tier, channel_overlap]

    SearchDiscoveryIntent:
      type: string
      enum: [competitor_candidate, official_product, price_channel, user_review, general]

    SearchDiscoveryRunStatus:
      type: string
      enum: [running, succeeded, failed, blocked]

    CompetitorMaterialDiscoveryStatus:
      type: string
      enum: [running, completed, partial, blocked, failed]

    CompetitorMaterialDecisionAction:
      type: string
      enum: [confirm, reject]

    SourceRouteTarget:
      type: string
      enum:
        - official_product
        - price_channel
        - user_review
        - user_research
        - market_research
        - technical_document
        - commercial_data
        - enterprise_internal
        - media_review

    SourceRoutingStatus:
      type: string
      enum: [needs_review, confirmed, rejected]

    SourceRoutingMethod:
      type: string
      enum: [deterministic, model, hybrid, manual]

    SourceProcessingJobStatus:
      type: string
      enum: [queued, running, succeeded, partial, blocked, failed, cancelled]

    SourceFragmentVerificationStatus:
      type: string
      enum: [verified, derived, invalid]

    SourceLocatorKind:
      type: string
      enum: [text, page, row, json, web, media_time, media_frame]

    ClaimStatus:
      type: string
      enum: [proposed, supported, disputed, missing_evidence, rejected, unknown]

    Recommendation:
      type: string
      enum: [recommend, investigate, do_not_recommend]

    ResearchConstraints:
      type: object
      additionalProperties: false
      required: [must_be_event_understanding, must_have_evidence, minimum_candidates, max_innovations]
      properties:
        must_be_event_understanding: { type: boolean, const: true }
        must_have_evidence: { type: boolean, const: true }
        minimum_candidates: { type: integer, minimum: 3, default: 3 }
        max_innovations: { type: integer, minimum: 3, maximum: 10, default: 5 }
        max_research_iterations: { type: integer, minimum: 0, maximum: 5, default: 2 }
        max_red_team_revisions: { type: integer, minimum: 0, maximum: 3, default: 1 }

    ResearchBrief:
      type: object
      additionalProperties: false
      required:
        - question
        - markets
        - categories
        - target_user_segments
        - brands
        - data_sources
        - time_range
        - constraints
      properties:
        question:
          type: string
          minLength: 5
          maxLength: 1000
        markets:
          type: array
          minItems: 1
          items: { type: string }
        categories:
          type: array
          minItems: 1
          items: { type: string }
        target_user_segments:
          type: array
          minItems: 1
          items: { type: string }
        brands:
          type: array
          minItems: 1
          items: { type: string }
        data_sources:
          type: array
          minItems: 1
          items: { type: string }
        time_range: { type: string }
        focus_dimensions:
          type: array
          items: { type: string }
        constraints:
          $ref: "#/components/schemas/ResearchConstraints"

    ProjectCreate:
      type: object
      additionalProperties: false
      required: [brief]
      properties:
        brief:
          $ref: "#/components/schemas/ResearchBrief"
        model_selection:
          oneOf:
            - $ref: "#/components/schemas/ModelSelection"
            - type: "null"

    Project:
      type: object
      additionalProperties: false
      required: [project_id, status, current_stage, progress, brief, model_selection, selected_innovation_ids, created_at, updated_at]
      properties:
        project_id: { type: string }
        status:
          $ref: "#/components/schemas/ProjectStatus"
        current_stage: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        brief:
          $ref: "#/components/schemas/ResearchBrief"
        model_selection:
          oneOf:
            - $ref: "#/components/schemas/ModelSelection"
            - type: "null"
        selected_innovation_ids:
          type: array
          items: { type: string }
        pending_decision:
          oneOf:
            - $ref: "#/components/schemas/PendingDecision"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }

    AgentRun:
      type: object
      additionalProperties: false
      required: [agent_run_id, project_id, agent_type, agent_name, status, progress, quality_score, message]
      properties:
        agent_run_id: { type: string }
        project_id: { type: string }
        task_id: { type: [string, "null"] }
        agent_type:
          type: string
          enum: [research_manager, user_research, competitor_research, product_technical, business, red_team]
        agent_name: { type: string }
        status:
          $ref: "#/components/schemas/AgentRunStatus"
        progress: { type: integer, minimum: 0, maximum: 100 }
        quality_score: { type: number, minimum: 0, maximum: 100 }
        message: { type: string }
        evidence_ids:
          type: array
          items: { type: string }
        unknowns:
          type: array
          items: { type: string }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        error_code: { type: [string, "null"] }
        error_message: { type: [string, "null"] }
        model_id: { type: [string, "null"] }
        model_provider: { type: [string, "null"] }
        prompt_key: { type: [string, "null"] }
        prompt_version: { type: [string, "null"] }
        input_tokens: { type: integer, minimum: 0, default: 0 }
        output_tokens: { type: integer, minimum: 0, default: 0 }
        estimated_cost_microusd: { type: integer, minimum: 0, default: 0 }

    PendingDecision:
      type: object
      additionalProperties: false
      required: [decision_id, gate, allowed_actions, checkpoint_id, requested_at]
      properties:
        decision_id: { type: string }
        gate:
          $ref: "#/components/schemas/DecisionGate"
        allowed_actions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DecisionAction"
        checkpoint_id: { type: string }
        requested_at: { type: string, format: date-time }

    Evidence:
      type: object
      additionalProperties: false
      required:
        - evidence_id
        - source_url
        - source_domain
        - source_asset_id
        - source_fragment_id
        - source_locator
        - source_type
        - title
        - original_excerpt
        - claim_type
        - collected_at
        - status
        - content_hash
        - confidence
      properties:
        evidence_id: { type: string }
        source_url: { type: [string, "null"], format: uri }
        source_domain: { type: [string, "null"] }
        source_asset_id: { type: [string, "null"] }
        source_fragment_id: { type: [string, "null"] }
        source_locator:
          oneOf:
            - $ref: "#/components/schemas/SourceLocator"
            - type: "null"
        source_type: { type: string }
        title: { type: string }
        original_excerpt: { type: string }
        claim_type:
          type: string
          enum: [fact, user_opinion, vendor_claim, agent_inference, product_identity, capability, specification, compatibility, limitation, price_observation, channel_availability, seller_information, promotion, market_fact, technical_fact]
        product: { type: [string, "null"] }
        region: { type: [string, "null"] }
        user_segment: { type: [string, "null"] }
        published_at: { type: [string, "null"], format: date-time }
        collected_at: { type: string, format: date-time }
        status:
          $ref: "#/components/schemas/EvidenceStatus"
        content_hash: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        authority_score: { type: number, minimum: 0, maximum: 1 }
        recency_score: { type: number, minimum: 0, maximum: 1 }
        diversity_score: { type: number, minimum: 0, maximum: 1 }

    EvidenceFromSourceFragmentCreate:
      type: object
      additionalProperties: false
      required:
        - claim_type
        - confidence
        - authority_score
        - recency_score
        - diversity_score
      properties:
        claim_type:
          type: string
          enum: [fact, user_opinion, vendor_claim, agent_inference, product_identity, capability, specification, compatibility, limitation, price_observation, channel_availability, seller_information, promotion, market_fact, technical_fact]
        product: { type: [string, "null"], maxLength: 160 }
        region: { type: [string, "null"], maxLength: 120 }
        user_segment: { type: [string, "null"], maxLength: 160 }
        published_at: { type: [string, "null"], format: date-time }
        confidence: { type: number, minimum: 0, maximum: 1 }
        authority_score: { type: number, minimum: 0, maximum: 1 }
        recency_score: { type: number, minimum: 0, maximum: 1 }
        diversity_score: { type: number, minimum: 0, maximum: 1 }

    EvidenceIngestResult:
      type: object
      additionalProperties: false
      required: [evidence, created]
      properties:
        evidence:
          $ref: "#/components/schemas/Evidence"
        created: { type: boolean }

    UserResearchEventChain:
      type: object
      additionalProperties: false
      required: [event, context, user_state, current_response, evidence_ids]
      properties:
        event: { type: string, minLength: 1 }
        context: { type: string, minLength: 1 }
        user_state: { type: string, minLength: 1 }
        current_response: { type: string, minLength: 1 }
        evidence_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }

    UserPainPoint:
      type: object
      additionalProperties: false
      required:
        - pain_point_id
        - user_expression
        - trigger_event
        - context
        - severity
        - frequency_basis
        - current_workaround
        - solution_gap
        - confidence
        - evidence_ids
      properties:
        pain_point_id: { type: string, minLength: 1, maxLength: 80 }
        user_expression: { type: string, minLength: 1 }
        trigger_event: { type: string, minLength: 1 }
        context: { type: string, minLength: 1 }
        severity: { type: string, enum: [low, medium, high] }
        frequency_basis: { type: string, minLength: 1 }
        current_workaround: { type: string, minLength: 1 }
        solution_gap: { type: string, minLength: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }

    UserUnmetNeed:
      type: object
      additionalProperties: false
      required: [need_id, statement, desired_outcome, confidence, evidence_ids]
      properties:
        need_id: { type: string, minLength: 1, maxLength: 80 }
        statement: { type: string, minLength: 1 }
        desired_outcome: { type: string, minLength: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }

    UserResearchGap:
      type: object
      additionalProperties: false
      required: [question, reason, severity, recommended_source_types]
      properties:
        question: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
        severity: { type: string, enum: [low, medium, high] }
        recommended_source_types:
          type: array
          items: { type: string }

    UserResearchPayload:
      type: object
      additionalProperties: false
      required:
        - summary
        - summary_evidence_ids
        - event_chains
        - pain_points
        - unmet_needs
        - sample_biases
        - research_gaps
        - evidence_coverage
      properties:
        summary: { type: string, minLength: 1 }
        summary_evidence_ids:
          type: array
          items: { type: string }
        event_chains:
          type: array
          items:
            $ref: "#/components/schemas/UserResearchEventChain"
        pain_points:
          type: array
          items:
            $ref: "#/components/schemas/UserPainPoint"
        unmet_needs:
          type: array
          items:
            $ref: "#/components/schemas/UserUnmetNeed"
        sample_biases:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [description, impact, evidence_ids]
            properties:
              description: { type: string, minLength: 1 }
              impact: { type: string, minLength: 1 }
              evidence_ids:
                type: array
                uniqueItems: true
                items: { type: string }
        research_gaps:
          type: array
          items:
            $ref: "#/components/schemas/UserResearchGap"
        evidence_coverage:
          type: object
          additionalProperties: false
          required:
            - available_evidence_count
            - included_evidence_count
            - cited_evidence_count
            - independent_domain_count
            - user_opinion_evidence_count
            - context_hash
          properties:
            available_evidence_count: { type: integer, minimum: 0 }
            included_evidence_count: { type: integer, minimum: 0 }
            cited_evidence_count: { type: integer, minimum: 0 }
            independent_domain_count: { type: integer, minimum: 0 }
            user_opinion_evidence_count: { type: integer, minimum: 0 }
            context_hash: { type: string, pattern: "^[a-f0-9]{64}$" }

    UserResearchArtifact:
      type: object
      additionalProperties: false
      required:
        - artifact_id
        - task_id
        - artifact_type
        - schema_version
        - status
        - payload
        - evidence_ids
        - contradictions
        - unknowns
        - quality_score
        - errors
      properties:
        artifact_id: { type: string }
        task_id: { type: string }
        artifact_type: { type: string, const: user_research }
        schema_version: { type: string }
        status:
          type: string
          enum: [completed, partial, blocked, needs_revision]
        payload:
          $ref: "#/components/schemas/UserResearchPayload"
        evidence_ids:
          type: array
          uniqueItems: true
          items: { type: string }
        contradictions:
          type: array
          items: { type: string }
        unknowns:
          type: array
          items: { type: string }
        quality_score: { type: number, minimum: 0, maximum: 100 }

    ProductTechnicalGap:
      type: object
      additionalProperties: false
      required: [gap_id, question, reason, required_evidence_types, affected_candidate_ids]
      properties:
        gap_id: { type: string, minLength: 1, maxLength: 80 }
        question: { type: string, minLength: 1, maxLength: 1500 }
        reason: { type: string, minLength: 1, maxLength: 1500 }
        required_evidence_types:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 120 }
        affected_candidate_ids:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 80 }

    ProductTechnicalAssessment:
      type: object
      additionalProperties: false
      required:
        - data_requirements
        - required_capabilities
        - privacy_constraints
        - feasibility_summary
        - demo_validation_plan
      properties:
        data_requirements:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 500 }
        required_capabilities:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 500 }
        privacy_constraints:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 500 }
        feasibility_summary: { type: string, minLength: 1, maxLength: 2000 }
        demo_validation_plan: { type: string, minLength: 1, maxLength: 2000 }

    ProductOpportunityCandidate:
      type: object
      additionalProperties: false
      required:
        - candidate_id
        - name
        - target_user
        - problem
        - event_understanding
        - competitor_gap_ids
        - technical_assessment
        - evidence_ids
        - gate_status
        - gate_issues
      properties:
        candidate_id: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 200 }
        target_user:
          type: object
          additionalProperties: false
          required: [persona_ids, description]
          properties:
            persona_ids:
              type: array
              uniqueItems: true
              items: { type: string }
            description: { type: string, minLength: 1 }
        problem:
          type: object
          additionalProperties: false
          required: [pain_ids, description]
          properties:
            pain_ids:
              type: array
              uniqueItems: true
              items: { type: string }
            description: { type: string, minLength: 1 }
        event_understanding:
          $ref: "#/components/schemas/EventUnderstanding"
        competitor_gap_ids:
          type: array
          uniqueItems: true
          items: { type: string }
        technical_assessment:
          $ref: "#/components/schemas/ProductTechnicalAssessment"
        evidence_ids:
          type: array
          minItems: 2
          uniqueItems: true
          items: { type: string }
        gate_status:
          type: string
          enum: [passed, blocked]
        gate_issues:
          type: array
          items: { type: string }

    ProductTechnicalCoverage:
      type: object
      additionalProperties: false
      required:
        - target_candidate_count
